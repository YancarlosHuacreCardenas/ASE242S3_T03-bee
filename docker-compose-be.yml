version: '3.8'
services:
  backend:
    image: nayeliherreraalbino/altavista-backend:4.0
    container_name: springboot-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://34.236.8.86:1433;databaseName=AltavistaDB;encrypt=false;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=MiPassword123!
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    restart: unless-stopped
    networks:
      - altavista-net

networks:
  altavista-net:
    driver: bridge

